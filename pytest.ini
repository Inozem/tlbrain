[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = --import-mode=importlib --strict-markers -m "not build and not install"
asyncio_mode = auto
markers =
    offline: synthetic-data tests that must not contact external services
    build: explicit build checks, excluded from the default offline suite
    install: explicit install checks, excluded from the default offline suite
norecursedirs = .git .venv .venv-test venv env ENV __pycache__ .pytest_cache .mypy_cache .ruff_cache .tox .nox .hypothesis build dist site-packages node_modules toolchain